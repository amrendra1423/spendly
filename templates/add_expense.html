{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}

<section class="profile-section">

    <div class="profile-card">
        <h1 class="profile-name">Add Expense</h1>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('add_expense') }}">
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" name="amount"
                       class="form-input" step="0.01" min="0.01"
                       value="{{ values.amount if values else '' }}"
                       required autofocus>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-input" required>
                    <option value="" disabled {{ 'selected' if not values }}>Select a category</option>
                    {% for c in categories %}
                    <option value="{{ c }}" {{ 'selected' if values and values.category == c }}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date"
                       class="form-input"
                       value="{{ values.date if values else today }}"
                       required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description"
                       class="form-input" maxlength="200"
                       value="{{ values.description if values else '' }}">
            </div>
            <button type="submit" class="btn-submit">Save Expense</button>
        </form>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Cancel</a>
        </p>
    </div>

</section>

{% endblock %}
